[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam"
version = "0.1.0"
description = "Red-team suite for a financial-services LLM agent, mapped to the OWASP Top 10 for LLM Applications."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
